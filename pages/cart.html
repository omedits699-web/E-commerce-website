<!DOCTYPE html>
<html>  
    <head>
        <title>Cart</title>
        <link rel="stylesheet" href="styles.css">
        <script src="index.js"></script>
    </head>
    <body>
        
    <header>
        <div class="logo-container">
            <img src="images/logo1.png" alt="ShopHub Logo" class="logo-icon">
            <h1>ShopHub</h1>
        </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      
    </nav>
    </header>
                <section class="cart-section">
                    <h2>Your Cart</h2>
                    <div class="student-banner">
                        <p> Student Discount: Enter your student ID for 50% off!</p>
                    </div>
                    <div class="student-id-section">
                        <label for="student-id">Student ID:</label>
                        <input type="text" id="student-id" placeholder="Enter your student ID">
                        <button onclick="applyStudentDiscount()">Apply Discount</button>
                    </div>
                    <div id="cart-items"></div>
                    <div class="cart-summary">
                        <p>Subtotal: <span id="subtotal">$0.00</span></p>
                        <p>Student Discount (50%): <span id="discount">-$0.00</span></p>
                        <p class="total">Total: <span id="total">$0.00</span></p>
                        <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
                    </div>
                </section>
                <script>
                    window.onload = function() {
                        displayCart();
                    }
                </script>
                <footer>
                    <p>&copy; 2026 ShopHub. All rights reserved.</p>
                </footer>
            </body>
        </html>
